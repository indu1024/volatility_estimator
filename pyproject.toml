[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-estimator"
version = "0.1.0"
description = "Compare historical, rolling, and EWMA volatility with macro-event before/after analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.50"]
dev = ["pytest>=8.0"]

[project.scripts]
vol-estimator = "volatility_estimator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
